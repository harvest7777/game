<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rotmg-no-slop</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="performance">
      <p><span>fps: </span> <span id="fps">----</span></p>
      <p><span>max frame time: </span> <span id="maxFrameTime">----</span></p>
      <p><span>avg frame time: </span> <span id="avgFrameTime">----</span></p>
      <p>
        <label
          >controls
          <select id="settingsControls">
            <option value="default">default (FRST, W/P)</option>
            <option value="wasd">WASD, Q/E</option>
          </select></label
        >
      </p>
      <p>debug renders</p>
      <label><input type="checkbox" id="debugHitboxes" /> hitboxes</label>
      <p>
        <label
          >weapon
          <select id="debugWeapon"></select
        ></label>
      </p>
      <p>
        <label
          >enemy
          <select id="debugEnemy"></select
        ></label>
        <button id="debugSpawn">spawn</button>
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
